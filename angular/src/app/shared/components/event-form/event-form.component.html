<div class="modal-header">
  <h4 class="modal-title pull-left">
    <i class="fa-regular fa-calendar-plus pe-2"></i>{{ title }}
  </h4>
  <small *ngIf="hint" class="text-secondary ms-3">{{ hint }}</small>
  <button
    type="button"
    class="btn-close close pull-right"
    aria-label="Close"
    (click)="dismiss.emit()"
  >
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="alert alert-dark p-2" [hidden]="!(validationError || error)">
    <i class="fa-solid fa-triangle-exclamation pe-2"></i
    >{{ validationError || error }}
  </div>
  <div class="form-group">
    <label for="event-name" class="form-label mt-2">Name of event</label>
    <input
      id="event-name"
      [(ngModel)]="name"
      class="form-control form-control-sm"
      placeholder="Enter name"
    />
  </div>
  <div class="form-group">
    <label for="event-description" class="form-label mt-2"
      >Description of event</label
    >
    <textarea
      id="event-description"
      [(ngModel)]="description"
      rows="3"
      class="form-control form-control-sm"
      placeholder="Enter description"
    ></textarea>
  </div>
  <div class="row">
    <div class="form-group col-7">
      <label for="event-date" class="form-label mt-2">Date of event</label>
      <input
        id="event-date"
        type="date"
        [(ngModel)]="date"
        class="form-control form-control-sm"
      />
    </div>
    <div class="form-group col-5">
      <label for="event-time" class="form-label mt-2">Start time</label>
      <input
        id="event-time"
        type="time"
        [(ngModel)]="time"
        class="form-control form-control-sm"
      />
    </div>
  </div>
  <div class="form-group">
    <label for="event-max-players" class="form-label mt-2"
      >Max players <small class="text-secondary">(optional)</small></label
    >
    <input
      id="event-max-players"
      type="number"
      min="1"
      step="1"
      [(ngModel)]="maxPlayers"
      class="form-control form-control-sm"
      placeholder="No limit"
    />
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-sm btn-secondary" (click)="dismiss.emit()">
    <i class="fa-regular fa-circle-xmark me-1"></i>Cancel
  </button>
  <button type="button" class="btn btn-sm btn-primary" (click)="submit()">
    <i class="fa-regular fa-circle-check me-2"></i>Save
  </button>
</div>
